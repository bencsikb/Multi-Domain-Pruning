[model]
model_path = "/data/blanka/runs/yolov8x_kitti/weights/last.pt" #"/data/blanka/MODELS/YOLOv10/kitti_tvt/weights/best.pt"  # path to a custom pretrained model
pretrained_type = "yolov8" # [yolov10, yolov8]
n_features = 6
data =  "config/data/kitti.yaml" #"config/data/kitti.yaml"
batch_size = 2
device = "cuda"

[samples]
save_path = "/data/blanka/DATASETS/SPN/YOLOv8x"
max_samples = 15000

[channel_selection]
ch_selector = "PuRL"
skipunder = 10
skipmod = []


[alpha]
value_list = None # if None, min, max and step has to be defined!
min_max_steps = [0, 2.2, 10] # min, max, n_steps
scale = "loge" # lin, half_sigmoid, loge
pdf_trans_index = 0
pdf_factor = 2

