[model]
model_path = "/data/blanka/runs/YOLO/yolov8x_kitti_newsplit/weights/best.pt"  # path to a custom pretrained model
pretrained_type = "yolov8" # [yolov10, yolov8]
n_features = 6
data =  "config/data/kitti_test.yaml" 
batch_size = 128
device = "cuda"

[samples]
save_path = "/data/blanka/DATASETS/SPN/YOLOv8x"
max_samples = 10000

[channel_selection]
ch_selector = "PuRL"
skipunder = 0
skipmod = []


[alpha]
value_list = None # if None, min, max and step has to be defined!
min_max_steps = [0, 2.2, 12] # min, max, n_steps
scale = "half_sigmoid" # lin, half_sigmoid, loge
pdf_trans_index = 0
pdf_factor = 2

