[model]
model_path = "/data/blanka/MODELS/YOLOv10/kitti_tvt/weights/best.pt"  # path to a custom pretrained model. If None, pretrained_type has to be specified!
pretrained_type = "yolov10" # [yolov10, ]
ignored_layers = [82, 83, 84]
n_features = 6
data =  "config/data/kitti.yaml" #"config/data/kitti.yaml"
batch_size = 128
device = "cuda"

[samples]
save_path = "/data/blanka/DATASETS/SPN/YOLOv10x"
max_samples = 10000

[channel_selection]
ch_selector = "PuRL"
skipunder = 30
skipmod = [2]


[alpha]
value_list = None # if None, min, max and step has to be defined!
min_max_steps = [0, 2.2, 10] # min, max, n_steps
scale = "loge" # lin, half_sigmoid, loge
pdf_trans_index = 60
pdf_factor = 2

