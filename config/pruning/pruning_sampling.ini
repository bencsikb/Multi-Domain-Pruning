[model]
model_path = None # path to a custom pretrained model. If None, pretrained_type has to be specified!
pretrained_type = "yolov10" # [yolov10, ]
ignored_layers = [82, 83, 84]
n_features = 6
data =  "config/data/kitti.yaml" #"config/data/kitti.yaml"
batch_size = 2

[samples]
save_path = "/data/blanka/DATASETS/SPN_YOLOv10"
max_samples = 100

[channel_selection]
ch_selector = "PuRL"
skipunder = 10
skipmod = 2


[alpha]
value_list = None # if None, min, max and step has to be defined!
min_max_step = [0, 2.2, 0.1]
