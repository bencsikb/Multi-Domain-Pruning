[model]
model_path = None #"/data/blanka/MODELS/YOLOv10/kitti_tvt/weights/best.pt"  # path to a custom pretrained model. If None, pretrained_type has to be specified!
pretrained_type = "yolov5" # [yolov10, yolov8]
ignored_layers = [] #[82, 83, 84]
n_features = 6
data =  "config/data/kitti.yaml" #"config/data/kitti.yaml"
batch_size = 2
device = "cuda"

[samples]
save_path = "/data/blanka/DATASETS/SPN/YOLOv5n"
max_samples = 10000

[channel_selection]
ch_selector = "PuRL"
skipunder = 0
skipmod = []


[alpha]
value_list = None # if None, min, max and step has to be defined!
min_max_steps = [0, 2.2, 10] # min, max, n_steps
scale = "loge" # lin, half_sigmoid, loge
pdf_trans_index = 0
pdf_factor = 2

