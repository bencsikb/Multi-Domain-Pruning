[data]
root = "/data/blanka/DATASETS/SPN/YOLOv8x_train70val30"
is_read_from_cache = False
cache_fantasy_name = "4features"

[save]
root = "/data/blanka/runs/SPN/YOLOv8x/train70val30_4features"

[model]
pretrained = None
state_features = [  'alpha',
                    'is_pruned', 
                    'in_ch',
                    'out_ch',
                    ; 'kernel',
                    ; 'stride',
                    ; 'pad',
                    ; 'n_pruned_ch'
                ]
n_prunable_layers =  93 
output_size = 2 # dmap, spars
loss = "logcosh" # [mse, logcosh]
dmap_loss_weight = 1
spars_loss_weight = 0.1
optimizer = "adam" # [adam]
lr_scheduler = "cos" # [cos]
start_lr = 1e-3
weight_decay = 1e-3

[train]
epochs = 1000
batch_size = 512
device = "cuda"
val_freq = 1

[alpha]
min_max_steps = [0, 2.2, 12] # min, max, n_steps
