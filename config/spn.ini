[data]
root = "/data/blanka/DATASETS/SPN/YOLOv8x_train50val50"

[save]
root = "/data/blanka/runs/SPN/YOLOv8x/train50val50"

[model]
pretrained = None
input_size =  744 # n_features * n_layers  = 8* 93
output_size = 2 # dmap, spars
loss = "logcosh" # [mse, logcosh]
dmap_loss_weight = 1
spars_loss_weight = 1
optimizer = "adam" # [adam]
lr_scheduler = "cos" # [cos]
start_lr = 1e-3
weight_decay = 1e-3

[train]
epochs = 1000
batch_size = 512
device = "cuda"
val_freq = 1

[alpha]
min_max_steps = [0, 2.2, 12] # min, max, n_steps
