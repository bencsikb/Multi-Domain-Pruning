[data]
root = "/data/blanka/DATASETS/SPN/YOLOv8x_7030_modelwise_shifted"
is_read_from_cache = True
cache_fantasy_name = "prev_features_modelwise_shifted"

[save]
root = "/data/blanka/runs/SPN/YOLOv8x/prev_features_modelwise_shifted"

[model]
pretrained = ''
do_resume = False
state_features = [  'alpha',
                    'is_pruned', 
                    ; 'in_ch',
                    ; 'out_ch',
                    ; 'kernel',
                    ; 'stride',
                    ; 'pad',
                    ; 'n_pruned_ch',
                    'prev_n_params',
                    'prev_map50'
                ]
multihead = True
n_prunable_layers =  93 
output_size = 2 # needed only if not multihead
loss = "logcosh" # [mse, logcosh]
do_freeze_backend = False
do_freeze_head_spars = False
do_freeze_head_dmap = False
dmap_loss_weight = 10
spars_loss_weight = 10
optimizer = "adamw" # [adam]
lr_scheduler = "cos" # [cos]
start_lr = 8e-5
weight_decay = 0.06

[train]
seed = 42
epochs = 1600
batch_size = 128
device = 'cuda'
val_freq = 1

[alpha]
min_max_steps = [0, 2.2, 12] # min, max, n_steps